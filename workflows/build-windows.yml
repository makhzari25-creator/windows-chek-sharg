name: Build Windows Installer

# این workflow به‌صورت خودکار .exe ویندوزی می‌سازد و نصاب تک‌فایلی
# (CheckHallCharge-Setup.exe) را به‌عنوان artifact تحویل می‌دهد.
# روی سرورهای Windows رایگان GitHub Actions اجرا می‌شود — نیازی به
# ویندوز محلی ندارید.

on:
  # هر بار که push یا merge به main/master شد، اجرا شود
  push:
    branches: [main, master]
  # اجرای دستی از تب Actions
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Bootstrap Windows scaffolding
        working-directory: win_project
        run: flutter create . --platforms=windows

      - name: Flutter pub get
        working-directory: win_project
        run: flutter pub get

      - name: Build Windows Release
        working-directory: win_project
        run: flutter build windows --release

      - name: Verify check_hall_charge.exe
        shell: pwsh
        run: |
          $exe = "win_project\build\windows\x64\runner\Release\check_hall_charge.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "check_hall_charge.exe پیدا نشد: $exe"
            exit 1
          }
          Write-Host "Build OK: $exe"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not $?) { throw "نصب Inno Setup شکست خورد" }

      - name: Compile installer (ISCC)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "CheckHallCharge.iss"
          if (-not $?) { throw "کامپایل نصاب شکست خورد" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckHallCharge-Setup
          path: installer_output/CheckHallCharge-Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload raw build folder (optional, debug)
        uses: actions/upload-artifact@v4
        with:
          name: CheckHallCharge-Release-folder
          path: win_project/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
